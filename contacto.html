<body>
  <header class="header">

      <div class="logo-container"><a href="index.html"><h1>MI <span>PROYECTO</span></h1></a></div>

      </nav>

  </header>
      <main>
        <section class="contact-section">
          <h2>Contáctame</h2>
          <form class="contact-form">
          <div class="form-group">
            <label for="name">Nombre:</label>
            <input type="text" id="name" name="name" placeholder="Tu nombre" required>
          </div>
          <div class="form-group"></div>
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" placeholder="Tu correo electrónico" required>
          </div>
          <div class="form-group">
            <label for="message">Mensaje:</label>
            <textarea id="message" name="message" rows="5" placeholder="Escribe tu mensaje aquí" required></textarea>
          </div>
          <button type="submit" class="btn-submit">Enviar</button>
          </form>
        <img src="assets/undraw_searching.svg" alt="Ilustración de contacto" class="hero">
        </section>
      </main>
      <footer>
        <!-- Comienzo del footer -->
